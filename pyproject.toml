[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "krippendorff"
version = "0.9.0"
description = "Fast computation of the Krippendorff's alpha measure."
authors = [
    { name = "Santiago Castro", email = "sacastro@fing.edu.uy" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]

readme = "README.md"

keywords = ["Krippendorff", "alpha", "agreement", "reliability", "coding", "coders", "units", "values"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.3,<1",
    "ty<1",
]

[project.urls]
Homepage = "https://github.com/pln-fing-udelar/fast-krippendorff"
Documentation = "https://github.com/pln-fing-udelar/fast-krippendorff"
Repository = "https://github.com/pln-fing-udelar/fast-krippendorff"
"Bug Tracker" = "https://github.com/pln-fing-udelar/fast-krippendorff/issues"
Changelog = "https://github.com/pln-fing-udelar/fast-krippendorff/releases"

[tool.ruff]
include = ["src/**/*.py", "pyproject.toml", "example.py"]
line-length = 120

[tool.ruff.lint]
ignore = [
    "ANN002",  # `*args` / `**kwargs`: the only annotation that fits is `Any`, which ANN401 then rejects.
    "ANN003",
    "ANN401",  # `Any` is the honest answer for a genuinely heterogeneous param; forbidding it invites a lie.
]
select = ["ANN", "B", "C", "C90", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ty.src]
include = ["src/**/*.py", "example.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.xml]
output = "test-reports/coverage.xml"

[tool.coverage.html]
directory = "test-reports/htmlcov"
