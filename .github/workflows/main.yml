name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  release:
    types: [ published ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install the project
        run: uv sync --locked
      - name: Lint with Ruff
        run: uv run ruff check
      - name: Check formatting with Ruff
        run: uv run ruff format --check
      - name: Type-check with ty
        run: uv run ty check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.13t', '3.14', '3.14t', '3.15', '3.15t' ]
        resolution-strategy: [ 'highest' ]
        include:
          - python-version: '3.11'
            resolution-strategy: 'lowest'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --resolution ${{ matrix.resolution-strategy }}
      - name: Test
        run: uv run pytest --doctest-modules --cov=krippendorff --cov-fail-under=90 --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11' && matrix.resolution-strategy == 'highest'
        with:
          name: coverage-report
          path: test-reports/coverage.xml
          if-no-files-found: error
      - name: Run example
        run: uv run python example.py

  upload-coverage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: test-reports
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./test-reports/coverage.xml
          use_oidc: true
          fail_ci_if_error: false


